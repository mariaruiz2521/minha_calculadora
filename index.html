<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card">
        <div>
            <h1>Minha Calculadora</h1>
        </div>
        <div id="input">
            <input type="number" placeholder="Primeiro Número">
            <input type="number" placeholder="Segundo Número">
        </div>
        <div id="botao">
            <input type="submit" value="+" id="somar">
            <input type="submit" value="-" id="subtrair">
            <input type="submit" value="x" id="multiplicar">
            <input type="submit" value="&#247" id="dividir">
        </div>
        <div>
            <p>Resultado:</p>
        </div>
    </div>
</body>
</html>
